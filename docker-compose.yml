version: '3.8'

services:
  web:
    build: .
    container_name: ai_humanizer_web
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      # Optional: Add server-side fallback API keys here
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
      # - GEMINI_API_KEY=${GEMINI_API_KEY}
      # - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - ./app:/app/app
    restart: unless-stopped
