<header class="bg-white/95 backdrop-blur-md border-b border-[#EAE3D2] sticky top-0 z-40 px-4 sm:px-8 py-3.5 transition-all">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
        
        <!-- Brand Identity -->
        <div class="flex items-center gap-3">
            <a href="/" class="flex items-center gap-3 group">
                <!-- Geometric Gold Insignia -->
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-[#DFBE73] via-[#C5A059] to-[#926F27] p-0.5 shadow-sm group-hover:shadow-gold transition-all duration-300">
                    <div class="w-full h-full bg-white rounded-[10px] flex items-center justify-center">
                        <svg class="w-5 h-5 text-gold-600 transition-transform duration-300 group-hover:scale-105" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="12 2 2 7 12 12 22 7 12 2"/>
                            <polyline points="2 17 12 22 22 17"/>
                            <polyline points="2 12 12 17 22 12"/>
                        </svg>
                    </div>
                </div>

                <div class="flex flex-col">
                    <div class="flex items-center gap-2">
                        <span class="text-xl font-extrabold tracking-tight text-zinc-900 font-sans">AURA</span>
                        <span class="text-xl font-medium tracking-tight text-gold-600">HUMANIZER</span>
                        <span class="hidden md:inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold tracking-wider uppercase bg-[#FAF3E3] text-[#8E6B2A] border border-[#E8D7B0]">
                            Enterprise
                        </span>
                    </div>
                    <span class="text-[10px] font-semibold text-zinc-400 tracking-wider uppercase hidden sm:block">
                        Proprietary Linguistic Bypass & Synthesizer
                    </span>
                </div>
            </a>
        </div>

        <!-- Center Section Navigation Links (Desktop) -->
        <nav class="hidden lg:flex items-center gap-6 text-xs font-semibold text-zinc-600">
            <a href="#workspace" class="hover:text-gold-700 transition-colors">Workspace</a>
            <a href="#detector-radar" class="hover:text-gold-700 transition-colors">Detector Radar</a>
            <a href="#architecture" class="hover:text-gold-700 transition-colors">Linguistic Engine</a>
            <a href="#benchmarks" class="hover:text-gold-700 transition-colors">Benchmarks</a>
            <a href="#faq" class="hover:text-gold-700 transition-colors">FAQ</a>
        </nav>

        <!-- Right System Indicators & Action -->
        <div class="flex items-center gap-3">
            
            <!-- Real-Time Engine Active Pill -->
            <div class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-full bg-[#FAF9F5] border border-[#E8DFC9] text-xs font-medium text-zinc-600">
                <span class="relative flex h-2 w-2">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                </span>
                <span class="font-mono text-[11px] font-semibold text-zinc-700">6-Stage Engine Ready</span>
            </div>

            <!-- API Configuration Trigger -->
            <button 
                @click="showSettings = true" 
                class="flex items-center gap-2 px-3.5 py-1.5 rounded-xl border border-[#DFCEAA] bg-white text-zinc-800 hover:bg-[#FAF5EC] hover:text-gold-900 hover:border-gold-500 transition-all text-xs font-bold shadow-sm focus:outline-none focus:ring-2 focus:ring-gold-400/30"
                title="Configure LLM API Credentials"
            >
                <svg class="w-3.5 h-3.5 text-gold-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                <span>API Settings</span>
            </button>

        </div>
    </div>
</header>
