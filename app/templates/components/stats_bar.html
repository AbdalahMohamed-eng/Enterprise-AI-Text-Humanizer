<div class="gold-card p-4 rounded-2xl flex flex-col md:flex-row gap-4 items-start md:items-center justify-between text-xs">
    
    <!-- AI Detection Verification Readouts -->
    <div class="flex flex-wrap items-center gap-3">
        <span class="font-bold uppercase tracking-wider text-zinc-400 text-[11px]">Audit Metrics:</span>

        <template x-if="inputAiScore === null && outputAiScore === null">
            <span class="text-zinc-400 italic">Click "Verify AI Score" above to run diagnostic check against detectors.</span>
        </template>

        <!-- Input Detection Score -->
        <template x-if="inputAiScore !== null">
            <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg border"
                 :class="inputAiScore > 50 ? 'bg-rose-50 text-rose-800 border-rose-200' : 'bg-emerald-50 text-emerald-800 border-emerald-200'">
                <span class="font-semibold">Original Score:</span>
                <span class="font-mono font-bold" x-text="inputAiScore + '% AI'"></span>
            </div>
        </template>

        <!-- Output Detection Score -->
        <template x-if="outputAiScore !== null">
            <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg border"
                 :class="outputAiScore > 35 ? 'bg-amber-50 text-amber-800 border-amber-200' : 'bg-emerald-50 text-emerald-800 border-emerald-200'">
                <span class="font-semibold">Humanized Score:</span>
                <span class="font-mono font-bold" x-text="outputAiScore + '% AI'"></span>
                <template x-if="outputAiScore <= 20">
                    <span class="ml-1 text-[10px] font-bold uppercase tracking-wider bg-emerald-200/60 text-emerald-900 px-1.5 py-0.5 rounded">Bypassed</span>
                </template>
            </div>
        </template>

        <!-- Score Delta -->
        <template x-if="inputAiScore !== null && outputAiScore !== null && (inputAiScore - outputAiScore) > 0">
            <div class="flex items-center gap-1 px-2.5 py-1.5 rounded-lg bg-gold-100 text-gold-800 border border-gold-300 font-semibold">
                <svg class="w-3.5 h-3.5 text-gold-700" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/>
                    <polyline points="17 18 23 18 23 12"/>
                </svg>
                <span>-<span x-text="Math.round(inputAiScore - outputAiScore)"></span>% AI Probability</span>
            </div>
        </template>
    </div>

    <!-- Detector Compatibility Footnote -->
    <div class="flex items-center gap-2 text-zinc-400 text-[11px]">
        <svg class="w-3.5 h-3.5 text-gold-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        <span>Optimized for GPTZero, Turnitin, Copyleaks & Originality.ai</span>
    </div>

</div>
