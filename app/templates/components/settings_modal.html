<dialog id="settings_modal" class="modal" :class="{'modal-open': showSettings}">
    <div class="modal-box bg-white border border-[#E8DEC9] shadow-gold-lg max-w-lg rounded-2xl p-6 text-zinc-900">
        
        <!-- Modal Header -->
        <div class="flex items-center justify-between pb-4 border-b border-[#EBE4D5]">
            <div class="flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-lg bg-gold-100 border border-gold-300 flex items-center justify-center text-gold-700">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                </div>
                <div>
                    <h3 class="font-bold text-base text-zinc-900">API Credentials</h3>
                    <p class="text-xs text-zinc-400">Bring Your Own Key (BYOK) architecture</p>
                </div>
            </div>

            <button 
                @click="showSettings = false"
                class="w-7 h-7 rounded-lg text-zinc-400 hover:text-zinc-700 hover:bg-zinc-100 flex items-center justify-center transition-all"
            >
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
        </div>
        
        <!-- Security Notice -->
        <div class="my-4 p-3 rounded-xl bg-[#FAF6EE] border border-[#EADBBD] flex items-start gap-2.5">
            <svg class="w-4 h-4 text-gold-700 shrink-0 mt-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
            <p class="text-xs text-[#7A5B22] leading-relaxed">
                Credentials are saved exclusively in your browser's private LocalStorage and passed in request headers. They are never logged or stored on our servers.
            </p>
        </div>

        <!-- Form Fields -->
        <div class="space-y-3.5">
            
            <!-- Groq API Key -->
            <div>
                <label class="block text-xs font-semibold text-zinc-700 mb-1 flex items-center justify-between">
                    <span>Groq API Key <span class="text-gold-600 font-normal">(Free & Recommended)</span></span>
                    <a href="https://console.groq.com/keys" target="_blank" class="text-[11px] text-gold-600 hover:underline">Get Key</a>
                </label>
                <input 
                    type="password" 
                    placeholder="gsk_..." 
                    class="w-full text-xs font-mono px-3 py-2 rounded-lg bg-[#FAF9F6] border border-[#DFCEAA] text-zinc-800 placeholder-zinc-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-gold-400/40 focus:border-gold-500 transition-all" 
                    x-model="apiKeys.groq" 
                />
            </div>

            <!-- OpenAI API Key -->
            <div>
                <label class="block text-xs font-semibold text-zinc-700 mb-1 flex items-center justify-between">
                    <span>OpenAI API Key</span>
                    <a href="https://platform.openai.com/api-keys" target="_blank" class="text-[11px] text-gold-600 hover:underline">Get Key</a>
                </label>
                <input 
                    type="password" 
                    placeholder="sk-..." 
                    class="w-full text-xs font-mono px-3 py-2 rounded-lg bg-[#FAF9F6] border border-[#DFCEAA] text-zinc-800 placeholder-zinc-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-gold-400/40 focus:border-gold-500 transition-all" 
                    x-model="apiKeys.openai" 
                />
            </div>

            <!-- Google Gemini API Key -->
            <div>
                <label class="block text-xs font-semibold text-zinc-700 mb-1 flex items-center justify-between">
                    <span>Google Gemini API Key</span>
                    <a href="https://aistudio.google.com/app/apikey" target="_blank" class="text-[11px] text-gold-600 hover:underline">Get Key</a>
                </label>
                <input 
                    type="password" 
                    placeholder="AIza..." 
                    class="w-full text-xs font-mono px-3 py-2 rounded-lg bg-[#FAF9F6] border border-[#DFCEAA] text-zinc-800 placeholder-zinc-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-gold-400/40 focus:border-gold-500 transition-all" 
                    x-model="apiKeys.gemini" 
                />
            </div>
            
            <!-- Sapling (Detection) -->
            <div>
                <label class="block text-xs font-semibold text-zinc-700 mb-1 flex items-center justify-between">
                    <span>Sapling API Key <span class="text-zinc-400 font-normal">(Optional for AI Detection)</span></span>
                    <a href="https://sapling.ai" target="_blank" class="text-[11px] text-zinc-400 hover:underline">Get Key</a>
                </label>
                <input 
                    type="password" 
                    placeholder="Sapling token..." 
                    class="w-full text-xs font-mono px-3 py-2 rounded-lg bg-[#FAF9F6] border border-[#DFCEAA] text-zinc-800 placeholder-zinc-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-gold-400/40 focus:border-gold-500 transition-all" 
                    x-model="apiKeys.sapling" 
                />
            </div>

        </div>

        <!-- Actions -->
        <div class="mt-6 pt-4 border-t border-[#EBE4D5] flex items-center justify-between">
            <button 
                @click="clearApiKeys()" 
                type="button"
                class="text-xs font-medium text-rose-600 hover:text-rose-700 hover:underline transition-all"
            >
                Clear All Keys
            </button>

            <div class="flex items-center gap-2">
                <button 
                    @click="showSettings = false" 
                    type="button"
                    class="px-3.5 py-1.5 rounded-lg border border-[#DFCEAA] text-xs font-semibold text-zinc-700 hover:bg-zinc-50"
                >
                    Cancel
                </button>
                <button 
                    @click="saveApiKeys()" 
                    type="button"
                    class="btn-gold px-4 py-1.5 rounded-lg text-xs font-semibold"
                >
                    Save Credentials
                </button>
            </div>
        </div>

    </div>
    
    <form method="dialog" class="modal-backdrop bg-zinc-900/40 backdrop-blur-sm">
        <button @click="showSettings = false">close</button>
    </form>
</dialog>
