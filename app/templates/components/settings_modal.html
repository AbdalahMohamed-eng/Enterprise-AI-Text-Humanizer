<dialog id="settings_modal" class="modal" :class="{'modal-open': showSettings}">
    <div class="modal-box bg-white border border-[#DFCEAA] shadow-2xl max-w-lg rounded-2xl p-6 text-zinc-900">
        
        <!-- Modal Header -->
        <div class="flex items-center justify-between pb-4 border-b border-[#EBE4D5]">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-gold-100 border border-gold-300 flex items-center justify-center text-gold-700">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                </div>
                <div>
                    <h3 class="font-bold text-base text-zinc-900">API Credentials & Provider Setup</h3>
                    <p class="text-xs text-zinc-400">Bring Your Own Key (BYOK) architecture</p>
                </div>
            </div>

            <button 
                @click="showSettings = false"
                class="w-8 h-8 rounded-lg text-zinc-400 hover:text-zinc-700 hover:bg-zinc-100 flex items-center justify-center transition-all"
            >
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
        </div>
        
        <!-- Privacy & Security Guarantee -->
        <div class="my-4 p-3.5 rounded-xl bg-[#FAF6EE] border border-[#EADBBD] flex items-start gap-3">
            <svg class="w-4 h-4 text-gold-700 shrink-0 mt-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
            <div class="text-xs text-[#7A5B22] leading-relaxed">
                <strong class="font-semibold text-gold-900">Zero Server-Side Retention:</strong> 
                Keys are stored only in your browser's private LocalStorage and transmitted directly in request headers. No credentials ever touch a database.
            </div>
        </div>

        <!-- Provider Inputs -->
        <div class="space-y-4">
            
            <!-- Groq API Key -->
            <div>
                <div class="flex items-center justify-between mb-1.5">
                    <label class="text-xs font-bold text-zinc-800 flex items-center gap-1.5">
                        <span>Groq API Key</span>
                        <span class="text-[10px] font-semibold text-emerald-700 bg-emerald-50 border border-emerald-200 px-1.5 py-0.2 rounded">Recommended / Free</span>
                    </label>
                    <a href="https://console.groq.com/keys" target="_blank" class="text-[11px] font-semibold text-gold-700 hover:underline flex items-center gap-1">
                        <span>Get Free Key</span>
                        <svg class="w-2.5 h-2.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                            <polyline points="15 3 21 3 21 9"/>
                            <line x1="10" y1="14" x2="21" y2="3"/>
                        </svg>
                    </a>
                </div>
                <input 
                    type="password" 
                    placeholder="gsk_..." 
                    class="w-full text-xs font-mono px-3.5 py-2.5 rounded-xl bg-[#FAF9F6] border border-[#DFCEAA] text-zinc-900 placeholder-zinc-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-gold-400/40 focus:border-gold-500 transition-all shadow-inner" 
                    x-model="apiKeys.groq" 
                />
            </div>

            <!-- OpenAI API Key -->
            <div>
                <div class="flex items-center justify-between mb-1.5">
                    <label class="text-xs font-bold text-zinc-800">OpenAI API Key</label>
                    <a href="https://platform.openai.com/api-keys" target="_blank" class="text-[11px] font-semibold text-gold-700 hover:underline flex items-center gap-1">
                        <span>OpenAI Console</span>
                        <svg class="w-2.5 h-2.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                            <polyline points="15 3 21 3 21 9"/>
                            <line x1="10" y1="14" x2="21" y2="3"/>
                        </svg>
                    </a>
                </div>
                <input 
                    type="password" 
                    placeholder="sk-..." 
                    class="w-full text-xs font-mono px-3.5 py-2.5 rounded-xl bg-[#FAF9F6] border border-[#DFCEAA] text-zinc-900 placeholder-zinc-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-gold-400/40 focus:border-gold-500 transition-all shadow-inner" 
                    x-model="apiKeys.openai" 
                />
            </div>

            <!-- Google Gemini API Key -->
            <div>
                <div class="flex items-center justify-between mb-1.5">
                    <label class="text-xs font-bold text-zinc-800">Google Gemini API Key</label>
                    <a href="https://aistudio.google.com/app/apikey" target="_blank" class="text-[11px] font-semibold text-gold-700 hover:underline flex items-center gap-1">
                        <span>Google AI Studio</span>
                        <svg class="w-2.5 h-2.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                            <polyline points="15 3 21 3 21 9"/>
                            <line x1="10" y1="14" x2="21" y2="3"/>
                        </svg>
                    </a>
                </div>
                <input 
                    type="password" 
                    placeholder="AIza..." 
                    class="w-full text-xs font-mono px-3.5 py-2.5 rounded-xl bg-[#FAF9F6] border border-[#DFCEAA] text-zinc-900 placeholder-zinc-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-gold-400/40 focus:border-gold-500 transition-all shadow-inner" 
                    x-model="apiKeys.gemini" 
                />
            </div>
            
            <!-- Sapling API Key -->
            <div>
                <div class="flex items-center justify-between mb-1.5">
                    <label class="text-xs font-bold text-zinc-800 flex items-center gap-1.5">
                        <span>Sapling AI Key</span>
                        <span class="text-[10px] text-zinc-400 font-normal">(Optional Cloud Detector)</span>
                    </label>
                    <a href="https://sapling.ai" target="_blank" class="text-[11px] font-semibold text-zinc-500 hover:underline">Get Key</a>
                </div>
                <input 
                    type="password" 
                    placeholder="Sapling token..." 
                    class="w-full text-xs font-mono px-3.5 py-2.5 rounded-xl bg-[#FAF9F6] border border-[#DFCEAA] text-zinc-900 placeholder-zinc-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-gold-400/40 focus:border-gold-500 transition-all shadow-inner" 
                    x-model="apiKeys.sapling" 
                />
            </div>

        </div>

        <!-- Modal Footer Actions -->
        <div class="mt-6 pt-4 border-t border-[#EBE4D5] flex items-center justify-between">
            <button 
                @click="clearApiKeys()" 
                type="button"
                class="text-xs font-semibold text-rose-600 hover:text-rose-700 hover:underline transition-all"
            >
                Clear All Credentials
            </button>

            <div class="flex items-center gap-2">
                <button 
                    @click="showSettings = false" 
                    type="button"
                    class="px-4 py-2 rounded-xl border border-[#DFCEAA] text-xs font-semibold text-zinc-700 hover:bg-zinc-50 transition-all"
                >
                    Cancel
                </button>
                <button 
                    @click="saveApiKeys()" 
                    type="button"
                    class="btn-gold-luxury px-5 py-2 rounded-xl text-xs font-bold uppercase tracking-wider"
                >
                    Save Settings
                </button>
            </div>
        </div>

    </div>
    
    <form method="dialog" class="modal-backdrop bg-zinc-900/50 backdrop-blur-sm">
        <button @click="showSettings = false">close</button>
    </form>
</dialog>
