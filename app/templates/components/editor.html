<div class="grid grid-cols-1 lg:grid-cols-2 gap-6 min-h-[580px]">
    
    <!-- Left Panel: Original Draft (Input) -->
    <div class="pro-card flex flex-col overflow-hidden bg-white">
        
        <!-- Action Header -->
        <div class="px-5 py-3.5 border-b border-[#EBE4D5] bg-[#FDFCF9] flex flex-wrap items-center justify-between gap-2">
            <div class="flex items-center gap-2">
                <div class="w-6 h-6 rounded-md bg-gold-100 flex items-center justify-center text-gold-700">
                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                    </svg>
                </div>
                <h3 class="font-bold text-xs uppercase tracking-wider text-zinc-800">Source AI Content</h3>
            </div>

            <!-- Toolbar Buttons -->
            <div class="flex items-center gap-2">
                <!-- Sample Loaders -->
                <div class="flex items-center gap-1 bg-[#F5F2EA] p-0.5 rounded-lg border border-[#E5DBCA]">
                    <button 
                        @click="loadSample('academic')"
                        type="button"
                        class="text-[11px] font-semibold text-zinc-600 hover:text-gold-900 px-2 py-0.5 rounded transition-all hover:bg-white"
                        title="Load Academic Sample"
                    >
                        Academic
                    </button>
                    <button 
                        @click="loadSample('marketing')"
                        type="button"
                        class="text-[11px] font-semibold text-zinc-600 hover:text-gold-900 px-2 py-0.5 rounded transition-all hover:bg-white"
                        title="Load Business/Tech Sample"
                    >
                        Business
                    </button>
                </div>

                <!-- 1-Click Paste -->
                <button 
                    @click="pasteInput()"
                    type="button"
                    class="text-[11px] font-semibold text-zinc-700 hover:text-gold-800 bg-white hover:bg-[#FAF5EC] border border-[#DFCEAA] px-2.5 py-1 rounded-lg transition-all flex items-center gap-1 shadow-sm"
                    title="Paste from clipboard"
                >
                    <svg class="w-3 h-3 text-gold-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
                        <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
                    </svg>
                    <span>Paste</span>
                </button>

                <!-- Clear -->
                <button 
                    x-show="inputText.length > 0"
                    @click="clearInput()"
                    type="button"
                    class="text-[11px] font-medium text-zinc-400 hover:text-rose-600 px-2 py-1 rounded transition-colors"
                >
                    Clear
                </button>

                <!-- Word Count Pill -->
                <span class="text-xs font-mono font-medium text-zinc-500 bg-white border border-[#E5DFD3] px-2.5 py-1 rounded-md">
                    <span x-text="inputWordCount"></span> words
                </span>
            </div>
        </div>

        <!-- Textarea Canvas -->
        <div class="flex-1 p-5 bg-white relative flex flex-col">
            <textarea 
                class="w-full flex-1 resize-none bg-transparent text-zinc-800 placeholder-zinc-300 text-sm leading-relaxed custom-scrollbar focus:outline-none" 
                placeholder="Paste AI text generated by ChatGPT, Claude, Gemini, or DeepSeek here to strip algorithmic fingerprints..."
                x-model="inputText"
            ></textarea>

            <!-- Bottom Telemetry Indicator -->
            <div class="pt-3 border-t border-[#F2ECE1] flex items-center justify-between text-xs text-zinc-400">
                <div class="flex items-center gap-2">
                    <template x-if="detectedClichesCount > 0">
                        <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded bg-amber-50 text-amber-800 border border-amber-200 text-[11px] font-semibold">
                            <svg class="w-3 h-3 text-amber-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"/>
                                <line x1="12" y1="8" x2="12" y2="12"/>
                                <line x1="12" y1="16" x2="12.01" y2="16"/>
                            </svg>
                            <span x-text="detectedClichesCount + ' AI markers detected'"></span>
                        </span>
                    </template>
                    <template x-if="detectedClichesCount === 0 && inputText.length > 30">
                        <span class="text-[11px] text-zinc-400 font-medium">Ready for synthesis</span>
                    </template>
                </div>
                <span class="font-mono text-[11px]" x-text="inputCharCount + ' chars'"></span>
            </div>
        </div>
    </div>

    <!-- Right Panel: Humanized Output -->
    <div class="pro-card flex flex-col overflow-hidden bg-white relative">
        
        <!-- Action Header -->
        <div class="px-5 py-3.5 border-b border-[#EBE4D5] bg-[#FDFCF9] flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-6 h-6 rounded-md bg-gold-100 flex items-center justify-center text-gold-700">
                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                    </svg>
                </div>
                <h3 class="font-bold text-xs uppercase tracking-wider text-zinc-800">Synthesized Human Prose</h3>
            </div>

            <div class="flex items-center gap-2">
                <span x-show="outputWordCount > 0" class="text-xs font-mono font-medium text-zinc-500 bg-white border border-[#E5DFD3] px-2.5 py-1 rounded-md">
                    <span x-text="outputWordCount"></span> words
                </span>

                <span x-show="outputWordCount > 0" class="text-xs font-medium text-gold-800 bg-[#FAF4E6] border border-[#E8D7B0] px-2.5 py-1 rounded-md">
                    ~<span x-text="readingTimeMinutes"></span> min read
                </span>
            </div>
        </div>

        <!-- Output Viewport -->
        <div class="flex-1 p-5 overflow-y-auto custom-scrollbar relative bg-white flex flex-col">
            
            <!-- Standard Formatted Output -->
            <div 
                x-show="!showDiff" 
                class="whitespace-pre-wrap text-sm leading-relaxed text-zinc-800 flex-1"
            >
                <template x-if="outputText">
                    <span x-text="outputText"></span>
                </template>

                <!-- Professional Empty State -->
                <template x-if="!outputText && !isStreaming">
                    <div class="h-full min-h-[360px] flex flex-col items-center justify-center text-center p-8 border-2 border-dashed border-[#EAE3D2] rounded-xl bg-[#FAF9F6]">
                        <div class="w-12 h-12 rounded-2xl bg-white border border-[#DFCEAA] flex items-center justify-center text-gold-600 shadow-sm mb-3">
                            <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                            </svg>
                        </div>
                        <h4 class="font-bold text-sm text-zinc-800 mb-1">Engine Standing By</h4>
                        <p class="text-xs text-zinc-500 max-w-sm leading-relaxed mb-4">
                            Paste text on the left or load an AI sample, then click <strong class="text-gold-700">Humanize & Bypass</strong> to disrupt AI detection signatures.
                        </p>
                        <button 
                            @click="loadSample('academic')"
                            type="button"
                            class="text-xs font-semibold text-gold-800 bg-white border border-[#DFCEAA] hover:bg-[#FAF5EC] px-3.5 py-1.5 rounded-lg shadow-sm transition-all"
                        >
                            Load Sample AI Draft
                        </button>
                    </div>
                </template>

                <span x-show="isStreaming" class="inline-block w-2 h-4 bg-gold-500 ml-1 rounded-sm animate-gold-cursor"></span>
            </div>

            <!-- Visual Word-Level Diff View -->
            <div 
                x-show="showDiff" 
                x-html="diffHtml" 
                class="whitespace-pre-wrap text-sm leading-relaxed font-mono bg-[#FAFAFA] p-5 rounded-xl border border-zinc-200 flex-1 overflow-y-auto"
            ></div>

        </div>

        <!-- Toolbar Footer -->
        <div class="px-5 py-3 border-t border-[#EBE4D5] bg-[#FDFCF9] flex flex-wrap items-center justify-between gap-3">
            
            <!-- Left Action: Multi-Detector Audit Trigger -->
            <div>
                <button 
                    @click="runFullDetectorAudit()" 
                    :disabled="isDetecting || !inputText.trim()"
                    class="btn-gold-subtle px-3.5 py-1.5 rounded-lg text-xs flex items-center gap-2 shadow-sm disabled:opacity-50 disabled:cursor-not-allowed"
                >
                    <template x-if="!isDetecting">
                        <div class="flex items-center gap-1.5">
                            <svg class="w-3.5 h-3.5 text-gold-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                                <path d="M9 12l2 2 4-4"/>
                            </svg>
                            <span>Run Multi-Detector Audit</span>
                        </div>
                    </template>
                    <template x-if="isDetecting">
                        <div class="flex items-center gap-1.5">
                            <svg class="animate-spin h-3.5 w-3.5 text-gold-600" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            <span>Benchmarking Detectors...</span>
                        </div>
                    </template>
                </button>
            </div>

            <!-- Right Actions: Diff, Download, Copy -->
            <div class="flex items-center gap-2">
                
                <!-- Diff Toggle -->
                <button 
                    @click="toggleDiff()" 
                    :disabled="!outputText.trim()"
                    :class="showDiff ? 'bg-gold-500 text-white border-gold-600' : 'bg-white text-zinc-700 border-[#DFCEAA] hover:bg-[#FAF5EC]'"
                    class="px-3 py-1.5 rounded-lg border text-xs font-semibold transition-all flex items-center gap-1.5 shadow-sm disabled:opacity-40 disabled:cursor-not-allowed"
                >
                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="16 3 21 3 21 8"/>
                        <line x1="4" y1="20" x2="21" y2="3"/>
                        <polyline points="21 16 21 21 16 21"/>
                        <line x1="15" y1="15" x2="21" y2="21"/>
                        <line x1="4" y1="4" x2="9" y2="9"/>
                    </svg>
                    <span x-text="showDiff ? 'Prose View' : 'Compare Diff'"></span>
                </button>

                <!-- Download Text -->
                <button 
                    @click="downloadOutput()" 
                    :disabled="!outputText.trim()"
                    class="px-3 py-1.5 rounded-lg border border-[#DFCEAA] bg-white text-zinc-700 hover:bg-[#FAF5EC] text-xs font-semibold flex items-center gap-1.5 disabled:opacity-40 disabled:cursor-not-allowed shadow-sm"
                    title="Download as .txt"
                >
                    <svg class="w-3.5 h-3.5 text-zinc-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    <span>Export</span>
                </button>

                <!-- Copy Output -->
                <button 
                    @click="copyOutput()" 
                    :disabled="!outputText.trim()"
                    class="btn-gold-luxury px-4 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 disabled:opacity-40 disabled:cursor-not-allowed"
                >
                    <template x-if="!copied">
                        <div class="flex items-center gap-1.5">
                            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                            </svg>
                            <span>Copy</span>
                        </div>
                    </template>
                    <template x-if="copied">
                        <div class="flex items-center gap-1.5 text-white">
                            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="20 6 9 17 4 12"/>
                            </svg>
                            <span>Copied!</span>
                        </div>
                    </template>
                </button>

            </div>
        </div>

    </div>

</div>
