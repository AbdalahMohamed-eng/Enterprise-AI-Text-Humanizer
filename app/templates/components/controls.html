<div class="bg-base-100 p-4 rounded-box shadow border border-base-300 flex flex-col md:flex-row gap-4 items-center justify-between">
    
    <div class="flex flex-wrap gap-4 items-center w-full md:w-auto">
        <!-- Tone Selector -->
        <div class="join">
            <input class="join-item btn btn-sm" type="radio" name="mode" value="casual" aria-label="Casual" x-model="mode"/>
            <input class="join-item btn btn-sm" type="radio" name="mode" value="formal" aria-label="Formal" x-model="mode"/>
            <input class="join-item btn btn-sm" type="radio" name="mode" value="academic" aria-label="Academic" x-model="mode"/>
            <input class="join-item btn btn-sm" type="radio" name="mode" value="anti_ai" aria-label="Anti-AI" x-model="mode"/>
        </div>

        <!-- Provider Dropdown -->
        <select class="select select-bordered select-sm" x-model="provider">
            <option value="groq">Groq</option>
            <option value="openai">OpenAI</option>
            <option value="gemini">Gemini</option>
        </select>

        <!-- Model Dropdown -->
        <select class="select select-bordered select-sm max-w-xs" x-model="model">
            <template x-for="m in currentModels" :key="m.id">
                <option :value="m.id" x-text="m.name"></option>
            </template>
        </select>
    </div>

    <!-- Humanize Button -->
    <button class="btn btn-primary w-full md:w-auto min-w-[150px]" @click="startHumanization()" :disabled="isStreaming || !inputText.trim()">
        <span x-show="!isStreaming" class="flex items-center gap-2">✨ Humanize Text</span>
        <span x-show="isStreaming" class="flex items-center gap-2">
            <span class="loading loading-spinner loading-sm"></span> Processing...
        </span>
    </button>
</div>
