<div class="gold-card p-4 rounded-2xl flex flex-col xl:flex-row gap-4 items-stretch xl:items-center justify-between">
    
    <!-- Left Configuration Controls -->
    <div class="flex flex-wrap gap-3 items-center">
        
        <!-- Tone Selector Segmented Control -->
        <div class="flex items-center gap-1.5 p-1 bg-[#F5F2EA] rounded-xl border border-[#E8DEC9]">
            <span class="text-xs font-bold uppercase tracking-wider text-zinc-400 px-2 select-none">Tone:</span>
            
            <button 
                type="button"
                @click="mode = 'anti_ai'"
                :class="mode === 'anti_ai' ? 'bg-gradient-to-r from-gold-500 to-gold-600 text-white shadow-sm' : 'text-zinc-600 hover:text-zinc-900 hover:bg-white/60'"
                class="px-3 py-1.5 rounded-lg text-xs font-semibold transition-all"
            >
                Anti-AI Bypass
            </button>

            <button 
                type="button"
                @click="mode = 'casual'"
                :class="mode === 'casual' ? 'bg-gradient-to-r from-gold-500 to-gold-600 text-white shadow-sm' : 'text-zinc-600 hover:text-zinc-900 hover:bg-white/60'"
                class="px-3 py-1.5 rounded-lg text-xs font-semibold transition-all"
            >
                Casual
            </button>

            <button 
                type="button"
                @click="mode = 'formal'"
                :class="mode === 'formal' ? 'bg-gradient-to-r from-gold-500 to-gold-600 text-white shadow-sm' : 'text-zinc-600 hover:text-zinc-900 hover:bg-white/60'"
                class="px-3 py-1.5 rounded-lg text-xs font-semibold transition-all"
            >
                Formal
            </button>

            <button 
                type="button"
                @click="mode = 'academic'"
                :class="mode === 'academic' ? 'bg-gradient-to-r from-gold-500 to-gold-600 text-white shadow-sm' : 'text-zinc-600 hover:text-zinc-900 hover:bg-white/60'"
                class="px-3 py-1.5 rounded-lg text-xs font-semibold transition-all"
            >
                Academic
            </button>
        </div>

        <!-- Provider Dropdown -->
        <div class="relative">
            <select 
                x-model="provider" 
                class="appearance-none bg-white border border-[#DFCEAA] text-zinc-800 text-xs font-medium rounded-xl px-3 py-2 pr-8 hover:border-gold-500 focus:outline-none focus:ring-2 focus:ring-gold-400/30 transition-all cursor-pointer shadow-sm"
            >
                <option value="groq">Groq (Ultra-Fast)</option>
                <option value="openai">OpenAI</option>
                <option value="gemini">Google Gemini</option>
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-zinc-400">
                <svg class="w-3.5 h-3.5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/>
                </svg>
            </div>
        </div>

        <!-- Model Dropdown -->
        <div class="relative">
            <select 
                x-model="model" 
                class="appearance-none bg-white border border-[#DFCEAA] text-zinc-800 text-xs font-medium rounded-xl px-3 py-2 pr-8 hover:border-gold-500 focus:outline-none focus:ring-2 focus:ring-gold-400/30 transition-all cursor-pointer shadow-sm max-w-[220px] truncate"
            >
                <template x-for="m in currentModels" :key="m.id">
                    <option :value="m.id" x-text="m.name"></option>
                </template>
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-zinc-400">
                <svg class="w-3.5 h-3.5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/>
                </svg>
            </div>
        </div>

    </div>

    <!-- Right Primary Action -->
    <div class="flex items-center gap-3">
        <button 
            @click="startHumanization()" 
            :disabled="isStreaming || !inputText.trim()"
            class="btn-gold w-full xl:w-auto px-6 py-2.5 rounded-xl flex items-center justify-center gap-2 text-sm font-semibold tracking-wide"
        >
            <template x-if="!isStreaming">
                <div class="flex items-center gap-2">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
                    </svg>
                    <span>Humanize Text</span>
                </div>
            </template>

            <template x-if="isStreaming">
                <div class="flex items-center gap-2">
                    <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span>Synthesizing...</span>
                </div>
            </template>
        </button>
    </div>

</div>
