<div class="pro-card p-4 sm:p-5 flex flex-col xl:flex-row gap-4 xl:items-center justify-between">
    
    <!-- Left Configuration Controls -->
    <div class="flex flex-wrap items-center gap-3">
        
        <!-- Tone Presets -->
        <div class="flex items-center gap-1 p-1 bg-[#F5F1E8] rounded-xl border border-[#E5DBCA]">
            <span class="text-[10px] font-bold uppercase tracking-wider text-zinc-400 px-2.5 select-none">Tone</span>
            
            <button 
                type="button"
                @click="mode = 'anti_ai'"
                :class="mode === 'anti_ai' ? 'bg-gradient-to-r from-gold-500 to-gold-600 text-white shadow-sm' : 'text-zinc-600 hover:text-zinc-900 hover:bg-white/60'"
                class="px-3 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center gap-1.5"
            >
                <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
                <span>Anti-AI Bypass</span>
            </button>

            <button 
                type="button"
                @click="mode = 'academic'"
                :class="mode === 'academic' ? 'bg-gradient-to-r from-gold-500 to-gold-600 text-white shadow-sm' : 'text-zinc-600 hover:text-zinc-900 hover:bg-white/60'"
                class="px-3 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center gap-1.5"
            >
                <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                    <path d="M6 12v5c3 3 9 3 12 0v-5"/>
                </svg>
                <span>Academic</span>
            </button>

            <button 
                type="button"
                @click="mode = 'formal'"
                :class="mode === 'formal' ? 'bg-gradient-to-r from-gold-500 to-gold-600 text-white shadow-sm' : 'text-zinc-600 hover:text-zinc-900 hover:bg-white/60'"
                class="px-3 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center gap-1.5"
            >
                <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
                    <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
                </svg>
                <span>Executive</span>
            </button>

            <button 
                type="button"
                @click="mode = 'casual'"
                :class="mode === 'casual' ? 'bg-gradient-to-r from-gold-500 to-gold-600 text-white shadow-sm' : 'text-zinc-600 hover:text-zinc-900 hover:bg-white/60'"
                class="px-3 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center gap-1.5"
            >
                <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                </svg>
                <span>Conversational</span>
            </button>
        </div>

        <!-- Strength / Intensity Setting -->
        <div class="flex items-center gap-1 p-1 bg-[#F5F1E8] rounded-xl border border-[#E5DBCA]">
            <span class="text-[10px] font-bold uppercase tracking-wider text-zinc-400 px-2 select-none">Bypass Depth</span>
            
            <button 
                type="button"
                @click="strength = 'light'"
                :class="strength === 'light' ? 'bg-white text-zinc-900 font-bold border border-[#DFCEAA] shadow-sm' : 'text-zinc-500 hover:text-zinc-900'"
                class="px-2.5 py-1 rounded-lg text-xs transition-all"
            >
                Light
            </button>
            <button 
                type="button"
                @click="strength = 'medium'"
                :class="strength === 'medium' ? 'bg-white text-zinc-900 font-bold border border-[#DFCEAA] shadow-sm' : 'text-zinc-500 hover:text-zinc-900'"
                class="px-2.5 py-1 rounded-lg text-xs transition-all"
            >
                Balanced
            </button>
            <button 
                type="button"
                @click="strength = 'aggressive'"
                :class="strength === 'aggressive' ? 'bg-white text-gold-800 font-bold border border-[#DFCEAA] shadow-sm' : 'text-zinc-500 hover:text-zinc-900'"
                class="px-2.5 py-1 rounded-lg text-xs transition-all"
            >
                Aggressive
            </button>
        </div>

        <!-- Provider Select -->
        <div class="relative">
            <select 
                x-model="provider" 
                class="appearance-none bg-white border border-[#DFCEAA] text-zinc-800 text-xs font-semibold rounded-xl px-3 py-2 pr-8 hover:border-gold-500 focus:outline-none focus:ring-2 focus:ring-gold-400/30 transition-all cursor-pointer shadow-sm"
            >
                <option value="groq">Groq (Ultra-Low Latency)</option>
                <option value="openai">OpenAI (Direct API)</option>
                <option value="gemini">Google Gemini Flash</option>
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-zinc-400">
                <svg class="w-3.5 h-3.5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/>
                </svg>
            </div>
        </div>

        <!-- Model Select -->
        <div class="relative">
            <select 
                x-model="model" 
                class="appearance-none bg-white border border-[#DFCEAA] text-zinc-800 text-xs font-semibold rounded-xl px-3 py-2 pr-8 hover:border-gold-500 focus:outline-none focus:ring-2 focus:ring-gold-400/30 transition-all cursor-pointer shadow-sm max-w-[210px] truncate"
            >
                <template x-for="m in currentModels" :key="m.id">
                    <option :value="m.id" x-text="m.name"></option>
                </template>
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-zinc-400">
                <svg class="w-3.5 h-3.5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/>
                </svg>
            </div>
        </div>

    </div>

    <!-- Right Primary Action -->
    <div class="flex items-center gap-3">
        <button 
            @click="startHumanization()" 
            :disabled="isStreaming || !inputText.trim()"
            class="btn-gold-luxury w-full xl:w-auto px-7 py-2.5 rounded-xl flex items-center justify-center gap-2 text-xs font-bold uppercase tracking-wider disabled:opacity-50"
        >
            <template x-if="!isStreaming">
                <div class="flex items-center gap-2">
                    <svg class="w-4 h-4 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                    </svg>
                    <span>Humanize & Bypass</span>
                </div>
            </template>

            <template x-if="isStreaming">
                <div class="flex items-center gap-2">
                    <svg class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span>Restructuring Prose...</span>
                </div>
            </template>
        </button>
    </div>

</div>
