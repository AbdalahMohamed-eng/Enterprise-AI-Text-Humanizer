<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Aura Humanizer — Enterprise AI Detection Bypass{% endblock %}</title>
    
    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },
            colors: {
              gold: {
                50: '#FDFCF7',
                100: '#FAF4E6',
                200: '#F2E4C4',
                300: '#E6CF9B',
                400: '#D4B36A',
                500: '#C5A059',
                600: '#B0883E',
                700: '#8E6B2A',
                800: '#6C5020',
                900: '#4D3817',
              }
            },
            boxShadow: {
              'gold-sm': '0 1px 3px rgba(197, 160, 89, 0.12), 0 1px 2px rgba(0, 0, 0, 0.04)',
              'gold': '0 4px 20px -2px rgba(197, 160, 89, 0.15), 0 2px 6px -1px rgba(0, 0, 0, 0.04)',
              'gold-lg': '0 10px 25px -3px rgba(197, 160, 89, 0.25), 0 4px 10px -2px rgba(0, 0, 0, 0.04)',
            }
          }
        }
      }
    </script>
    
    <!-- DaisyUI CDN -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4/dist/full.min.css" rel="stylesheet" type="text/css" />
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/custom.css">

    <!-- jsdiff CDN -->
    <script src="https://cdn.jsdelivr.net/npm/diff/dist/diff.min.js"></script>

    <!-- Custom Application JS (LOADED BEFORE ALPINE) -->
    <script src="/static/js/diff.js"></script>
    <script src="/static/js/app.js"></script>
    
    <!-- Alpine.js (Loaded with defer AFTER app.js has registered components) -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
</head>
<body class="min-h-screen bg-[#F8F7F4] text-zinc-900 font-sans antialiased selection:bg-gold-200 selection:text-gold-900">
    {% block content %}{% endblock %}
</body>
</html>
