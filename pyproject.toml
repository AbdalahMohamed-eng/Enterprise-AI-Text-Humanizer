[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "humanizer"
version = "0.1.0"
description = "AURA: Enterprise AI Text Humanizer & Linguistic Bypass Engine"
authors = [
    { name = "Abdalah Mohamed" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.0",
    "pydantic-settings>=2.0.0",
    "litellm>=1.40.0",
    "spacy>=3.7.0",
    "lemminflect>=0.2.3",
    "nltk>=3.9.0",
    "textstat>=0.7.0",
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v"
